name: Fork static staging (FreeDSP browser-only BLOCKED)

on:
  workflow_dispatch:
    inputs:
      acknowledge_static_only:
        description: 'Deploy static UI staging only; FreeDSP browser-only hardware support is BLOCKED'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: fork-pages-staging
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'henryshuen/Audiocular-Aura' && github.ref == 'refs/heads/fix/freedsp-conexant' && inputs.acknowledge_static_only
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, Vite official deployment example
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/Audiocular-Aura/ --outDir=.tmp/pages-staging
      - run: node scripts/verify-pages.mjs .tmp/pages-staging
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .tmp/pages-staging
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy fork static staging
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
